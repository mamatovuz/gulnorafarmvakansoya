<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f8f6d" />
    <title>Gulnora Farm HR</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <section id="loginView" class="login-view">
        <div class="login-card">
          <img class="brand-mark large" src="/assets/gulnora-mark.svg" alt="Gulnora Farm" />
          <div>
            <p class="eyebrow">Gulnora Farm</p>
            <h1>HR ilova</h1>
            <p class="muted">Telegram ID, username yoki telefon raqam bilan kiring.</p>
          </div>
          <form id="loginForm" class="stack">
            <label>
              <span>Telegram ID / telefon</span>
              <input id="loginIdentifier" autocomplete="username" placeholder="+998901234567" required />
            </label>
            <button class="primary-btn" type="submit">Kirish</button>
          </form>
          <p class="hint">Kirish uchun foydalanuvchi bot bazasida bor bo'lishi kerak.</p>
        </div>
      </section>

      <section id="appView" class="main-view hidden">
        <header class="topbar">
          <div class="brand">
            <img class="brand-mark" src="/assets/gulnora-mark.svg" alt="" />
            <div>
              <strong>Gulnora Farm</strong>
              <span id="roleLabel">HR ilova</span>
            </div>
          </div>
          <div class="top-actions">
            <button class="icon-btn" id="refreshBtn" title="Yangilash" aria-label="Yangilash">
              <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.3 6.4M3 12A9 9 0 0 1 18.3 5.6"/><path d="M21 4v6h-6M3 20v-6h6"/></svg>
            </button>
            <button class="avatar-btn" id="logoutBtn" title="Chiqish">GF</button>
          </div>
        </header>

        <main id="pageRoot" class="content"></main>

        <nav class="bottom-nav" aria-label="Asosiy bo'limlar">
          <button class="nav-item active" data-tab="home">
            <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>
            <span>Bosh sahifa</span>
          </button>
          <button class="nav-item" data-tab="attendance">
            <svg viewBox="0 0 24 24"><path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span>Davomat</span>
          </button>
          <button class="nav-item" data-tab="profile">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.8-4 5-6 8-6s6.2 2 8 6"/></svg>
            <span>Profil</span>
          </button>
          <button class="nav-item" data-tab="notifications">
            <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
            <span>Bildirishnoma</span>
            <b id="navBadge" class="nav-badge hidden">0</b>
          </button>
        </nav>
      </section>
    </div>

    <div id="toast" class="toast hidden"></div>
    <dialog id="modal" class="modal"></dialog>
    <script src="/app.js" defer></script>
  </body>
</html>
